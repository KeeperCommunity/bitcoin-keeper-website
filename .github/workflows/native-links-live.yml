name: Native link public HTTP acceptance

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.creator.login == 'vercel[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify probe failure controls
        run: node --test scripts/native-links-live.test.mjs
      - name: Verify public association headers, bytes and fallbacks
        run: node scripts/native-links-live.mjs
